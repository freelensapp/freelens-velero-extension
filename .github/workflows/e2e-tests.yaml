name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
    # The fixtures and the transport proof run the scripts of the environment
    # and the main process built from src/main and src/common, never the
    # renderer: a pull request that changes only the renderer, the suites of
    # the views, the documents, the unit tests or the configuration of the
    # linters does not run them. Any other file does, and so do every push to
    # main and the run of every night.
    paths:
      - "**"
      - "!src/renderer/**"
      - "!e2e/__tests__/**"
      - "!e2e/views-parts.json"
      - "!integration/**"
      - "!environment-tests/**"
      - "!docs/**"
      - "!**/*.md"
      - "!**/*.test.ts"
      - "!**/*.test.tsx"
      - "!LICENSE"
      - "!.github/**"
      - "!.trunk/**"
      - "!.claude/**"
      - "!.renovaterc.json*"
      - "!knip.jsonc"
      - "!biome.jsonc"
      - .github/workflows/e2e-tests.yaml
      - .nvmrc
  # The fixtures and the transport proof with the server of the release, every
  # night, on main.
  schedule:
    - cron: 47 1 * * *
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-e2e:
    name: e2e tests

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    env:
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ubuntu-24.04-arm-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-24.04-arm-node-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      # A dedicated kind cluster with Velero, its AWS plugin and SeaweedFS, from
      # official images pinned by digest. The scripts keep their state, with the
      # generated credentials, under the home of the runner: no step uploads it.
      - name: Bring the test environment up
        run: pnpm --color=always e2e:cluster:up

      - name: Run the fixtures and the transport proof
        run: pnpm --color=always e2e

      - name: Take the test environment down
        if: always()
        run: pnpm --color=always e2e:cluster:down
