name: Automated tag

on:
  issue_comment:
    types:
      - created
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:
  create-tag:
    name: tag

    runs-on: ubuntu-24.04
    environment: automated
    timeout-minutes: 10

    # The merge of the pull request of the version, or the comment `/tag` on that
    # pull request once it is closed, from an owner, a member or a collaborator
    # of the repository: a comment of anyone else, who may comment on any pull
    # request, does not start the job.
    if: |
      (github.event_name == 'pull_request'
      && startsWith(github.event.pull_request.title, 'Automated npm version')
      && github.event.pull_request.merged)
      || (github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && startsWith(github.event.issue.title, 'Automated npm version')
      && github.event.issue.state == 'closed'
      && github.event.comment.body == '/tag'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      # The commit of the version is the merge commit of its pull request, never
      # main as it is when the job runs, which can have moved since the merge
      # (REQ-315 of SPEC-0018). On the merge, it is the one of the event; on
      # `/tag`, the one of the pull request the comment is on, read through the
      # API, which must have been merged into main.
      - name: Get the merge commit of the pull request of the version
        id: merge-commit
        uses: actions/github-script@v9
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          script: |
            let sha = process.env.MERGE_COMMIT_SHA;
            if (context.eventName === 'issue_comment') {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              if (!pull.merged || pull.base.ref !== 'main') {
                core.setFailed(`Pull request #${pull.number} was not merged into main: nothing is tagged`);
                return;
              }
              sha = pull.merge_commit_sha;
            }
            if (!/^[0-9a-f]{40}$/.test(sha ?? '')) {
              core.setFailed(`No merge commit to tag: ${sha}`);
              return;
            }
            core.setOutput('sha', sha);

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.merge-commit.outputs.sha }}

      - name: Get version from package.json
        id: package-json
        run: |
          echo "version=$(yq -r .version package.json)" >> $GITHUB_OUTPUT

      # A version X.Y.Z, or a prerelease X.Y.Z-N of the line of SPEC-0015 (D10),
      # which the release workflow publishes on the npm tag `next` and marks as
      # a prerelease on GitHub. No other form of a version is tagged.
      - name: Check if version is release
        id: check-version
        run: |
          if [[ "${{ steps.package-json.outputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag on the merge commit of the pull request of the version
        if: steps.check-version.outputs.is_release == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const result = await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/v${{ steps.package-json.outputs.version }}',
              sha: '${{ steps.merge-commit.outputs.sha }}',
            });
            console.log(result);
          github-token: ${{ secrets.GH_TOKEN }}
