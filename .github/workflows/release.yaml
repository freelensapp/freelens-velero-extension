name: Release

# A version in three jobs (REQ-286 of SPEC-0018). The job `package` holds no
# credential: it builds the tag and packs the tarball once, makes the bill of
# materials of the packed file, the checksums, the notes of the version and the
# list of what the package contains, and takes the sha256 of the five files as
# outputs, before anything of Freelens or of a cache of APT is restored or
# started; then it runs FND-10 on that very tarball in Freelens built at the
# commit of the validation target, and uploads the files once their bytes are
# checked against those outputs. The job `publish`, at a pushed tag alone and in
# the environment `publishing`, builds nothing: it checks the files against the
# outputs of `package` and publishes the tarball. The job `release`, with no
# credential of npm, checks them the same way and creates the GitHub release.
# On a pull request that changes one of the paths below, the pull request of a
# version among them, and when started by hand, `package` runs alone and
# nothing is published.
on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - "*"
    paths:
      - .github/workflows/release.yaml
      - .github/scripts/list-package-contents.sh
      - .github/actions/build-freelens/**
      - CHANGELOG.md
      - package.json
      - pnpm-lock.yaml
      - vite.config.mjs
      - build/**
      - src/**
      - README.md
      - LICENSE
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # The commit of Freelens FND-10 runs on: the validation target of SPEC-0015.
  # It moves only with that target, and this line is the one that names it
  # here.
  freelens_ref: b9b53e16056578c5407312eba5823a089972f6d5

jobs:
  package:
    name: package

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    # The job installs packages with apt-get and sudo, builds or restores a
    # third-party application and starts it: it reads the repository and
    # nothing else, with no environment and no secret (D3 of SPEC-0018).
    permissions:
      contents: read

    env:
      DO_NOT_TRACK: "1"

    # The tarball and the sha256 of the five files of the release, taken
    # before anything of Freelens or of a cache of APT is restored or started.
    # The jobs after this one check the files against them.
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      sums: ${{ steps.sums.outputs.sums }}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock, every time: no cache
      # is restored, so nothing a run on main wrote reaches the tag. The action
      # that builds Freelens reads it too.
      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5 # datasource=github-releases depName=jdx/mise
          install_args: yq
          cache: false

      - name: Check if package version matches
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME}" = "v$(yq -r .version package.json)"

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      # The store of pnpm, which runs on main save under this key as well: at a
      # tag no cache is restored before the pack, and the packages come from the
      # registry, checked against the lockfile.
      - name: Use pnpm cache
        if: github.ref_type != 'tag'
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: node-freelens-${{ env.freelens_ref }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-freelens-${{ env.freelens_ref }}-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build plugin
        id: build-plugin
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry)
        id: build-plugin-2
        if: steps.build-plugin.outcome == 'failure'
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry 2)
        if: steps.build-plugin-2.outcome == 'failure'
        run: pnpm build

      # The one tarball of the run, packed once: the bill of materials, the
      # checksums and the list of the contents are of it, FND-10 installs it,
      # and the job `publish` publishes it. Its name and its sha256 are outputs
      # of this step, which no later step can change, unlike the environment of
      # the job.
      - name: Pack plugin
        id: pack
        run: |
          set -euo pipefail
          pnpm clean:tgz
          pnpm pack
          shopt -s nullglob
          tarballs=(*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::One tarball is expected after the pack, found ${#tarballs[@]}"
            exit 1
          fi
          sha256=$(sha256sum "${tarballs[0]}" | cut -d ' ' -f 1)
          echo "${sha256}  ${tarballs[0]}"
          echo "tarball=${tarballs[0]}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      # The bill of materials is of what the package carries (REQ-307, D10 of
      # SPEC-0018): the packed file installed, never from the registry, in a new
      # empty directory, with no devDependency, no peer, no script and no
      # lockfile, so the extension and the libraries its bundles carry.
      # `--prefix` names the directory npm installs into: in a directory with no
      # manifest npm would take the nearest one above it, the workspace. The
      # scan reads the manifests of the packages the directory holds, which the
      # scan of a directory leaves to the lockfiles unless it is asked to, and
      # the manifest npm writes at its root, which names no package, is not one
      # of them. The root of the document, which holds the packages, is named
      # after the tarball.
      - name: Install the tarball for the bill of materials
        run: |
          mkdir bill-of-materials
          npm install --prefix bill-of-materials --omit=dev --omit=peer --ignore-scripts --no-package-lock "${GITHUB_WORKSPACE}/${TARBALL}"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}

      - name: Create SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: bill-of-materials
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
        env:
          SYFT_DEFAULT_CATALOGERS: javascript-package-cataloger
          SYFT_SOURCE_NAME: ${{ steps.pack.outputs.tarball }}

      - name: Normalize SBOM filename
        shell: bash
        run: |
          for f in *.tgz; do
            mv sbom.spdx.json "${f%.tgz}-spdx.json"
          done

      # What the bill of materials lists, by name and version, in the log, each
      # at the version of the lockfile, since npm resolved the libraries from
      # the registry by the ranges of the manifests: the extension at the one of
      # package.json; a dependency of package.json at the one pnpm resolved for
      # it, `importers['.'].dependencies.<name>.version` of the document of the
      # project in the lockfile, without the versions of its peers; and any
      # other library at one the lockfile resolved. The root of the document is
      # the tarball.
      - name: Show the packages of the bill of materials
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const [document, tarball] = process.argv.slice(1);
            const manifest = JSON.parse(readFileSync("package.json", "utf8"));
            const lockfile = readFileSync("pnpm-lock.yaml", "utf8");
            const importer =
              /\nimporters:\n\n  \.:\n(?:    [^\n]*\n)*?    dependencies:\n((?:      [^\n]*\n)+)/.exec(lockfile)?.[1] ?? "";
            const direct = new Map(
              [...importer.matchAll(/^      (\x27?)([^\x27\n]+)\1:\n        specifier: [^\n]*\n        version: ([^(\n]+)/gm)].map(
                ([, , name, version]) => [name, version],
              ),
            );
            let failed = false;

            for (const { name, versionInfo = "" } of JSON.parse(readFileSync(document, "utf8")).packages) {
              const key = name.startsWith("@") ? `\x27${name}@${versionInfo}\x27` : `${name}@${versionInfo}`;
              const resolved =
                name === manifest.name
                  ? versionInfo === manifest.version
                  : Object.hasOwn(manifest.dependencies ?? {}, name)
                    ? direct.get(name) === versionInfo
                    : lockfile.includes(`\n  ${key}:\n`);

              console.log(`${name} ${versionInfo}`);
              if (name !== tarball && !resolved) {
                console.log(`::error::${name} ${versionInfo} is not at the version of the lockfile`);
                failed = true;
              }
            }
            process.exitCode = failed ? 1 : 0;
          ' "${TARBALL%.tgz}-spdx.json" "${TARBALL}"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}

      - name: Make checksums
        shell: bash
        run: |
          for f in *.tgz *-spdx.json; do
            sha256sum "$f" | tee "$f.sha256"
          done

      # The notes of the version (REQ-303, D12 of SPEC-0018): its section of
      # CHANGELOG.md, headed `## v<version> - <YYYY-MM-DD>` and running to the
      # next `## ` heading, without the heading, which the GitHub release names
      # by the tag. At a tag, and on a pull request whose version has the form
      # the tag workflow tags, the pull request of the version among them, a
      # version with no section stops the run before anything is published. On
      # another pull request or by hand, where the version is one that is never
      # released, the newest section stands in for a missing one, or a line that
      # says there is none, with a warning.
      - name: Make the notes of the version
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          strict=false
          if [ "${GITHUB_REF_TYPE}" = tag ] || [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            strict=true
          fi
          # The lines of the first section whose heading starts with $1, without
          # the heading and the blank lines around them.
          section() {
            [ -f CHANGELOG.md ] || return 0
            awk -v prefix="$1" '
              found && /^## / { exit }
              found { lines[++n] = $0; next }
              index($0, prefix) == 1 && /^## v[^ ]+ - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/ { found = 1 }
              END {
                for (first = 1; first <= n && lines[first] ~ /^[[:space:]]*$/; first++) {}
                for (last = n; last >= first && lines[last] ~ /^[[:space:]]*$/; last--) {}
                for (i = first; i <= last; i++) print lines[i]
              }
            ' CHANGELOG.md
          }
          notes=$(section "## v${version} - ")
          if [ -z "${notes}" ]; then
            if [ "${strict}" = true ]; then
              echo "::error::CHANGELOG.md has no section ## v${version} - <YYYY-MM-DD>: the notes of a version are written in a pull request before the one of the version"
              exit 1
            fi
            echo "::warning::CHANGELOG.md has no section for ${version}, which is not a version the tag workflow tags: the newest section stands in for it"
            notes=$(section "## v")
            notes=${notes:-No notes: CHANGELOG.md has no section of a version.}
          fi
          printf '%s\n' "${notes}" > release-notes.md
          cat release-notes.md

      # What the package contains (REQ-316 of SPEC-0018), by the script a unit
      # case runs as well: what it fails on is said in the script.
      - name: List the contents of the package
        run: bash .github/scripts/list-package-contents.sh "${TARBALL}"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}

      # The sha256 of the five files of the release, taken before anything of
      # Freelens or of APT is restored or started, as outputs of this step, which
      # no later step can change: the check before the upload and the jobs
      # `publish` and `release` compare the files with them. The tarball is
      # still the one of the pack.
      - name: Take the sha256 of the files of the release
        id: sums
        run: |
          set -euo pipefail
          if [ "$(sha256sum "${TARBALL}" | cut -d ' ' -f 1)" != "${PACKED}" ]; then
            echo "::error::${TARBALL} changed after the pack"
            exit 1
          fi
          {
            echo "sums<<END_OF_SUMS"
            sha256sum "${TARBALL}" "${TARBALL}.sha256" "${TARBALL%.tgz}-spdx.json" "${TARBALL%.tgz}-spdx.json.sha256" release-notes.md
            echo "END_OF_SUMS"
          } >> "${GITHUB_OUTPUT}"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          PACKED: ${{ steps.pack.outputs.sha256 }}

      # Cache the .deb archives and package lists that `playwright install-deps`
      # downloads through apt, so re-runs reuse them instead of re-downloading.
      # apt is pointed at this project-local directory via a global config file
      # written in the install step below.
      - name: Use APT cache
        uses: actions/cache@v6
        with:
          path: .apt
          key: ubuntu-24.04-arm-apt-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-24.04-arm-apt-

      # FND-10 drives the packaged application with `_electron` of Playwright,
      # which uses the Chromium of Electron, so Playwright's browsers are never
      # downloaded. `install-deps` still apt-installs the shared libraries that
      # Chromium (and thus Electron) needs to launch under xvfb, and xvfb
      # itself. It runs the playwright that pnpm-lock.yaml pins, the version of
      # the catalog of Freelens.
      - name: Install Playwright's OS dependencies
        run: |
          set -eo pipefail
          # `playwright install-deps` runs its own `apt-get update`/`install`,
          # so the archive/list redirect has to be a global apt config file it
          # picks up rather than per-invocation `-o` flags. dpkg's status stays
          # at the system default, so packages still install into the runner.
          mkdir -p .apt/cache/archives/partial .apt/state/lists/partial
          sudo tee /etc/apt/apt.conf.d/00freelens-cache >/dev/null <<EOF
          Dir::Cache::archives "$PWD/.apt/cache/archives";
          Dir::State::lists "$PWD/.apt/state/lists";
          EOF
          pnpm exec playwright install-deps chromium
          # apt ran as root, so hand the cache dir back to the runner user for
          # the cache-save post step to read.
          sudo chown -R "$(id -u):$(id -g)" .apt

      # Freelens built at the validation target, or the build the cache keeps
      # for that commit, with its sandbox let start and its path in
      # FREELENS_APP, by the action this workflow shares with the workflows of
      # the integration tests and of the views.
      - name: Build Freelens
        uses: ./.github/actions/build-freelens
        with:
          ref: ${{ env.freelens_ref }}

      # FND-10 on the packed file, with no cluster, as the integration workflow
      # runs it beside the sessions of the kinds: the extension installed from
      # EXTENSION_PATH, the tarball of this run, in a new profile of the
      # application FREELENS_APP names, under xvfb with a screen that has room
      # for its largest window. Without EXTENSION_PATH the helpers would
      # install the package from the registry by its name. A failure is not
      # retried, and stops the run before anything is published.
      - name: Run FND-10 on the tarball
        timeout-minutes: 30
        run: xvfb-run -a --server-args="-screen 0 1920x1200x24" pnpm test:integration integration/__tests__/extensions.tests.ts
        env:
          EXTENSION_PATH: ${{ github.workspace }}/${{ steps.pack.outputs.tarball }}

      # Before the upload: one file of each kind the release attaches, the
      # tarball the one of the pack with the bytes it had then, and every file
      # with the bytes whose sha256 the outputs hold, the checksum files naming
      # the tarball and the bill of materials as they are.
      - name: Check the files of the release
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(*.tgz)
          sums=(*.tgz.sha256)
          bills=(*-spdx.json)
          bill_sums=(*-spdx.json.sha256)
          found="${#tarballs[@]} ${#sums[@]} ${#bills[@]} ${#bill_sums[@]}"
          if [ "${found}" != "1 1 1 1" ] || [ "${tarballs[0]}" != "${TARBALL}" ]; then
            echo "::error::One tarball, ${TARBALL}, one bill of materials and their checksums are expected; found ${found} of them"
            exit 1
          fi
          if [ "$(sha256sum "${TARBALL}" | cut -d ' ' -f 1)" != "${PACKED}" ]; then
            echo "::error::${TARBALL} changed after the pack: its bytes are not the ones FND-10 was given"
            exit 1
          fi
          printf '%s\n' "${SUMS}" >"${RUNNER_TEMP}/sums"
          sha256sum --strict -c "${RUNNER_TEMP}/sums"
          sha256sum --strict -c "${TARBALL}.sha256" "${TARBALL%.tgz}-spdx.json.sha256"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          PACKED: ${{ steps.pack.outputs.sha256 }}
          SUMS: ${{ steps.sums.outputs.sums }}

      # The files the jobs `publish` and `release` take, as the release
      # attaches them, and the notes it gives the release as its body.
      - name: Upload the files of the release
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            *.tgz
            *.tgz.sha256
            *-spdx.json
            *-spdx.json.sha256
            release-notes.md
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    # A tag that was pushed: never a pull request, and never a run started by
    # hand, even on a tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    # The go of a publication is the merge of the pull request of the version,
    # which the tag workflow tags (D11b of SPEC-0018), as in the other
    # extensions of the organization. The identity of the run is what the
    # provenance takes; the job reads the repository and writes nothing of it.
    environment: publishing
    permissions:
      contents: read
      id-token: write

    steps:
      # The versions of Node.js and of pnpm, from .nvmrc and from the
      # packageManager of package.json with its hash. Nothing is installed,
      # built or packed.
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        run: corepack enable

      # Into a directory of their own beside the checkout, so that nothing the
      # artifact holds lands where pnpm reads its settings.
      - name: Download the files of the release
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # The five files `package` made, and nothing else: the tarball is the one
      # `package` packed, which FND-10 installed, by its name, which the tag
      # gives as well, and by the sha256 of the pack; every file has the bytes
      # whose sha256 `package` took before anything of Freelens ran, and the
      # bill of materials the bytes its checksum names.
      - name: Verify the files of the release
        working-directory: release
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          named="freelensapp-velero-extension-${GITHUB_REF_NAME#v}.tgz"
          if [ "${TARBALL}" != "${named}" ]; then
            echo "::error::package packed ${TARBALL}, and the tag names ${named}"
            exit 1
          fi
          files=(*)
          present=0
          for name in "${TARBALL}" "${TARBALL}.sha256" "${TARBALL%.tgz}-spdx.json" "${TARBALL%.tgz}-spdx.json.sha256" release-notes.md; do
            if [ -f "${name}" ]; then
              present=$((present + 1))
            fi
          done
          if [ "${#files[@]}" -ne 5 ] || [ "${present}" -ne 5 ]; then
            echo "::error::The five files package made are expected, and nothing else; found ${#files[@]}: ${files[*]:-}"
            exit 1
          fi
          if [ "$(sha256sum "${TARBALL}" | cut -d ' ' -f 1)" != "${SHA256}" ]; then
            echo "::error::${TARBALL} is not the file package packed and FND-10 installed"
            exit 1
          fi
          printf '%s\n' "${SUMS}" >"${RUNNER_TEMP}/sums"
          sha256sum --strict -c "${RUNNER_TEMP}/sums"
          sha256sum --strict -c "${TARBALL%.tgz}-spdx.json.sha256"
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
          SHA256: ${{ needs.package.outputs.sha256 }}
          SUMS: ${{ needs.package.outputs.sums }}

      # The packed file itself: pnpm hands a tarball to the registry as it is,
      # with no repack and no script. The provenance is asked on both ways (D11a):
      # with the token of `publishing`, which publishes every version up to
      # 1.0.0, and through the trusted publisher configured after it (D11b).
      # The registry takes a version once, so the step first asks it, with no
      # credential, for the integrity of the version. The sha512 of the
      # tarball, as after a publication whose answer was lost: the version is
      # not published again and the job passes, so that a re-run of the failed
      # jobs reaches `release`. Another, or no answer: the job fails. None: the
      # version is published, in one attempt.
      - name: Publish npm package
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            *-*) dist_tag=next;;
            *) dist_tag=latest;;
          esac
          spec="@freelensapp/velero-extension@${GITHUB_REF_NAME#v}"
          integrity=$(node -p '"sha512-" + require("node:crypto").createHash("sha512").update(require("node:fs").readFileSync(process.argv[1])).digest("base64")' "release/${TARBALL}")
          view=$(npm view "${spec}" dist.integrity --json --userconfig /dev/null --registry https://registry.npmjs.org/ 2>/dev/null) || true
          answer=$(node -p '(() => { try { const answer = JSON.parse(process.argv[1]); return typeof answer === "string" ? answer : `error ${answer.error.code}`; } catch { return "error with no answer"; } })()' "${view}")
          case "${answer}" in
            "${integrity}")
              echo "::notice::${spec} is on the registry with the bytes of ${TARBALL}: it is not published again"
              exit 0
              ;;
            "error E404")
              echo "${spec} is not on the registry"
              ;;
            error\ *)
              echo "::error::The registry did not say whether ${spec} is on it: ${answer}"
              exit 1
              ;;
            *)
              echo "::error::${spec} is on the registry with ${answer}, other bytes than the ${integrity} of ${TARBALL}"
              exit 1
              ;;
          esac
          if [[ -n ${NPM_TOKEN:-} ]]; then
            NODE_AUTH_TOKEN="${NPM_TOKEN}" pnpm --color=always publish "./release/${TARBALL}" \
              --no-git-checks \
              --provenance \
              --tag "${dist_tag}"
          else
            pnpm --color=always publish "./release/${TARBALL}" \
              --no-git-checks \
              --provenance \
              --tag "${dist_tag}"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.package.outputs.tarball }}

  # The GitHub release, in a job of its own with no environment and no
  # identity for npm: it writes the release and nothing else. A run that fails
  # after the pack is taken up by re-running its failed jobs: `publish` does
  # not publish again a version the registry holds with the bytes of the
  # tarball, so the re-run reaches this job, which makes the release from the
  # same files.
  release:
    name: release
    needs: [package, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      # Into the workspace, which holds nothing else: the job checks nothing
      # out.
      - name: Download the files of the release
        uses: actions/download-artifact@v8
        with:
          name: release

      # As in `publish`: the five files `package` made, and nothing else, which
      # the release attaches.
      - name: Verify the files of the release
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          named="freelensapp-velero-extension-${GITHUB_REF_NAME#v}.tgz"
          if [ "${TARBALL}" != "${named}" ]; then
            echo "::error::package packed ${TARBALL}, and the tag names ${named}"
            exit 1
          fi
          files=(*)
          present=0
          for name in "${TARBALL}" "${TARBALL}.sha256" "${TARBALL%.tgz}-spdx.json" "${TARBALL%.tgz}-spdx.json.sha256" release-notes.md; do
            if [ -f "${name}" ]; then
              present=$((present + 1))
            fi
          done
          if [ "${#files[@]}" -ne 5 ] || [ "${present}" -ne 5 ]; then
            echo "::error::The five files package made are expected, and nothing else; found ${#files[@]}: ${files[*]:-}"
            exit 1
          fi
          if [ "$(sha256sum "${TARBALL}" | cut -d ' ' -f 1)" != "${SHA256}" ]; then
            echo "::error::${TARBALL} is not the file package packed and FND-10 installed"
            exit 1
          fi
          printf '%s\n' "${SUMS}" >"${RUNNER_TEMP}/sums"
          sha256sum --strict -c "${RUNNER_TEMP}/sums"
          sha256sum --strict -c "${TARBALL%.tgz}-spdx.json.sha256"
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
          SHA256: ${{ needs.package.outputs.sha256 }}
          SUMS: ${{ needs.package.outputs.sums }}

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |-
            *.tgz
            *.tgz.sha256
            *-spdx.json
            *-spdx.json.sha256
