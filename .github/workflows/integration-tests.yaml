name: Integration tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # The commit of Freelens the integration tests run on: the validation
  # target of SPEC-0015. It moves only with that target, and this line is the
  # one that names it here.
  freelens_ref: 5e1870e97467edab81b856a4983483d0729db896

jobs:
  test-integration:
    name: integration tests with Freelens v2

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    env:
      DO_NOT_TRACK: "1"
      TURBOREPO_CACHE: ${{ github.workspace }}/freelens/.turbo

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.11 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: node-freelens-${{ env.freelens_ref }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-freelens-${{ env.freelens_ref }}-

      - name: Install pnpm dependencies for extension
        id: install-pnpm-extension
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for extension (retry)
        if: steps.install-pnpm-extension.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The build that gets published: the tests install its tarball.
      - name: Build plugin
        id: build-plugin
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry)
        id: build-plugin-2
        if: steps.build-plugin.outcome == 'failure'
        run: pnpm build
        continue-on-error: true

      - name: Build plugin (retry 2)
        if: steps.build-plugin-2.outcome == 'failure'
        run: pnpm build

      - name: Pack plugin
        run: pnpm clean:tgz && pnpm pack

      # Cache the .deb archives and package lists that `playwright install-deps`
      # downloads through apt, so re-runs reuse them instead of re-downloading.
      # apt is pointed at this project-local directory via a global config file
      # written in the install step below.
      - name: Use APT cache
        uses: actions/cache@v6
        with:
          path: .apt
          key: ubuntu-24.04-arm-apt-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-24.04-arm-apt-

      # The tests drive the packaged application with `_electron` of
      # Playwright, which uses the Chromium of Electron, so Playwright's
      # browsers are never downloaded. `install-deps` still apt-installs the
      # shared libraries that Chromium (and thus Electron) needs to launch
      # under xvfb, and xvfb itself. It runs the playwright that pnpm-lock.yaml
      # pins, the version of the catalog of Freelens.
      - name: Install Playwright's OS dependencies
        run: |
          set -eo pipefail
          # `playwright install-deps` runs its own `apt-get update`/`install`,
          # so the archive/list redirect has to be a global apt config file it
          # picks up rather than per-invocation `-o` flags. dpkg's status stays
          # at the system default, so packages still install into the runner.
          mkdir -p .apt/cache/archives/partial .apt/state/lists/partial
          sudo tee /etc/apt/apt.conf.d/00freelens-cache >/dev/null <<EOF
          Dir::Cache::archives "$PWD/.apt/cache/archives";
          Dir::State::lists "$PWD/.apt/state/lists";
          EOF
          pnpm exec playwright install-deps chromium
          # apt ran as root, so hand the cache dir back to the runner user for
          # the cache-save post step to read.
          sudo chown -R "$(id -u):$(id -g)" .apt

      # The disposable kind cluster of this repository's scripts, with Velero
      # and the CRDs of the reviewed release, and none of the fixtures: each
      # session of the integration tests places its own object. The state of
      # the environment, with the generated credentials, is under the home of
      # the runner: no step uploads it.
      - name: Bring the test environment up
        run: pnpm --color=always e2e:cluster:up

      - name: Checkout app
        uses: actions/checkout@v7
        with:
          repository: freelensapp/freelens
          ref: ${{ env.freelens_ref }}
          path: freelens

      # The packaged application does not depend on the extension, which the
      # tests install at run time, so its build is the same for a given commit
      # of Freelens: the key names that commit, never a version or a branch, and
      # is the key of the suites of the views. It is exact (no restore-keys), so
      # a partial match never produces a stale or incomplete dist directory,
      # and it is saved only after a successful build. On a hit nothing of
      # Freelens is installed or built.
      - name: Restore Electron build cache
        id: electron-build-cache
        uses: actions/cache/restore@v6
        with:
          path: freelens/freelens/dist
          key: ubuntu-24.04-arm-electron-dist-${{ env.freelens_ref }}

      - name: Setup node for app
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: freelens/.nvmrc
          package-manager-cache: false

      - name: Setup pnpm for app
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        run: corepack enable

      # pnpm-lock.yaml holds several YAML documents (pnpm 12 puts
      # packageManagerDependencies in a document of its own), so evaluate them
      # all and take the one that has the importer. The version carries a peer
      # suffix, e.g. 1.2.3(supports-color@8.1.1), which split drops.
      - name: Get Electron version
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        run: |
          electron_version=$(yq ea -r '[.importers.freelens.devDependencies.electron.version | select(. != null)] | .[0] // error("electron not found in pnpm-lock.yaml") | split("(") | .[0]' freelens/pnpm-lock.yaml)
          echo "electron_version=${electron_version}" >> ${GITHUB_ENV}

      # electron-builder's Electron zip downloader reads no cache directory
      # override and always writes into the OS-default Electron cache dir, so
      # that is what has to be cached. Restored here and saved explicitly right
      # after the build of the application, instead of the combined
      # actions/cache action, whose save runs only in a post-job step, which is
      # skipped once a later step in the job fails.
      - name: Restore Electron cache
        id: electron-cache-restore
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/electron
          key: ubuntu-24.04-arm-electron-${{ env.electron_version }}
          restore-keys: |
            ubuntu-24.04-arm-electron-

      # The same files as in Freelens's own integration tests workflow.
      - name: Use Turborepo cache
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.TURBOREPO_CACHE }}
          key: ubuntu-24.04-arm-turborepo-${{ hashFiles('freelens/package.json', 'freelens/freelens/package.json', 'freelens/packages/**/package.json', 'freelens/pnpm-lock.yaml', 'freelens/turbo.json', 'freelens/tsconfig*.json', 'freelens/packages/infrastructure/typescript/config/*.json') }}
          restore-keys: |
            ubuntu-24.04-arm-turborepo-

      - name: Install pnpm dependencies for app
        id: install-pnpm-app
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for app (retry)
        if: steps.electron-build-cache.outputs.cache-hit != 'true' && steps.install-pnpm-app.outcome == 'failure'
        working-directory: freelens
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Without known checksums, @electron/get downloads SHASUMS256.txt from
      # GitHub on every build, bypassing its cache, even when the Electron zip
      # is cached, so an outage of GitHub fails the packaging. electron-builder
      # takes them from SHASUMS256.txt-<version> at the root of that cache
      # instead, and the electron package ships the same checksums, which the
      # lockfile has verified. Electron is a devDependency of the app package,
      # freelens/freelens in this checkout.
      - name: Seed Electron checksums
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: freelens/freelens
        run: |-
          mkdir -p ~/.cache/electron
          node -e '
            const checksums = require("electron/checksums.json");
            const lines = Object.entries(checksums).map(([file, sha256]) => `${sha256} *${file}\n`);
            require("node:fs").writeFileSync(process.argv[1], lines.join(""));
          ' "$HOME/.cache/electron/SHASUMS256.txt-$electron_version"

      - name: Disable pre post scripts for pnpm
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: pnpm config set enablePrePostScripts false --location project

      - name: Build app
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: pnpm --color=always --stream build

      # kubectl and freelens-k8s-proxy, which the application runs for a cluster.
      - name: Build extra resources
        id: build-resources
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry)
        id: build-resources-2
        if: steps.electron-build-cache.outputs.cache-hit != 'true' && steps.build-resources.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources
        continue-on-error: true

      - name: Build extra resources (retry 2)
        if: steps.electron-build-cache.outputs.cache-hit != 'true' && steps.build-resources-2.outcome == 'failure'
        working-directory: freelens
        run: pnpm --color=always build:resources

      - name: Get electron-builder path
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens/freelens
        run: |
          EB_PATH=$(node -e "console.log(require.resolve('electron-builder/cli'))")
          echo "ELECTRON_BUILDER_PATH=$EB_PATH" >> $GITHUB_ENV

      # electron-builder collects the modules to package with `pnpm list --prod`,
      # so app.asar gets only the production dependencies of freelens from the
      # regular workspace node_modules, as in the release build.
      - name: Build Electron app
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        working-directory: freelens/freelens
        run: node "$ELECTRON_BUILDER_PATH" --publish never --linux dir --arm64
        env:
          npm_config_user_agent: pnpm

      # Saved on a miss or a restore-key hit, also when the build above failed
      # after the download; skipped on an exact hit, where actions/cache/save
      # would only warn that it cannot reserve the key.
      - name: Save Electron cache
        if: always() && steps.electron-build-cache.outputs.cache-hit != 'true' && steps.electron-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron-cache-restore.outputs.cache-primary-key }}

      # Save only after a successful build (this step is not reached if the
      # electron-builder run above failed), so the cache never holds a partial
      # dist directory.
      - name: Save Electron build cache
        if: steps.electron-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: freelens/freelens/dist
          key: ${{ steps.electron-build-cache.outputs.cache-primary-key }}

      - name: Setup node for plugin
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Electron's sandbox helper needs to be setuid root, which a restored
      # cache does not keep. The tests start the application FREELENS_APP names.
      - name: Let the sandbox of the application start
        run: |
          sudo chown root:root freelens/freelens/dist/linux*-unpacked/chrome-sandbox
          sudo chmod 4755 freelens/freelens/dist/linux*-unpacked/chrome-sandbox
          echo "FREELENS_APP=$(echo "$PWD"/freelens/freelens/dist/linux*-unpacked)" >> "$GITHUB_ENV"

      # FND-10, with no cluster, and the session of each of the five kinds,
      # from this repository, as `pnpm e2e:integration` runs them: the runner
      # checks the target of the environment, runs the files one at a time
      # under xvfb, each in a new profile of the application, checks the
      # target again and that no session left anything in the cluster. The
      # tests are deterministic, so a failure is not retried.
      - name: Run integration tests
        run: node e2e/scripts/local-demo.mts integration --context kind-freelens-velero-dev

      # The screenshots a failure leaves, of the frame of the test cluster:
      # synthetic data. The state of the environment is not among them.
      - name: Upload the screenshots of the integration tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Take the test environment down
        if: always()
        run: pnpm --color=always e2e:cluster:down
