name: Views tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  # Every part, every night, on main.
  schedule:
    - cron: 17 1 * * *
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # The commit of Freelens the suites run on: the validation target of
  # SPEC-0015. It moves only with that target, and this line is the one that
  # names it here.
  freelens_ref: b9b53e16056578c5407312eba5823a089972f6d5

jobs:
  # The parts a run takes, by e2e/scripts/views-plan.mts and the rules of
  # e2e/views-parts.json: every part on main, every night and on demand; on a
  # pull request, the parts its changed files reach, every part for a file no
  # rule knows, and none for documents and unit tests alone.
  plan:
    name: parts of the views

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5

    outputs:
      parts: ${{ steps.plan.outputs.parts }}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Decide the parts
        id: plan
        run: node e2e/scripts/views-plan.mts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # The views in Freelens built from source at the validation target, in parts
  # side by side: each part is a job with an environment of its own, the test
  # environment with its fixtures left in place or the CRDs of the release
  # alone, and a run takes as long as its longest part instead of the sum of
  # them. The application is built by the action the integration tests build
  # it with, and cached by the same key. The parts are in
  # e2e/views-parts.json, and a unit test checks that they name every suite of
  # the views, the pre-review and FND-10, each in one part, and that a part
  # with no controller names only suites that read none.
  test-views:
    name: views in Freelens v2 (${{ matrix.part.name }})
    needs: plan
    if: ${{ needs.plan.outputs.parts != '[]' }}

    strategy:
      # A part that fails does not stop the others: a run reports every suite.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150

    env:
      DO_NOT_TRACK: "1"

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      # yq comes from mise so that its version has a single source (mise.toml)
      # and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.8 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: node-freelens-${{ env.freelens_ref }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            node-freelens-${{ env.freelens_ref }}-

      - name: Install pnpm dependencies for extension
        id: install-pnpm-extension
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        continue-on-error: true

      - name: Install pnpm dependencies for extension (retry)
        if: steps.install-pnpm-extension.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The build that gets published: the suites install its tarball.
      - name: Build plugin
        run: pnpm build

      - name: Pack plugin
        run: pnpm clean:tgz && pnpm pack

      # Cache the .deb archives and package lists that `playwright install-deps`
      # downloads through apt, so re-runs reuse them instead of re-downloading.
      # apt is pointed at this project-local directory via a global config file
      # written in the install step below.
      - name: Use APT cache
        uses: actions/cache@v6
        with:
          path: .apt
          key: ubuntu-24.04-arm-apt-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-24.04-arm-apt-

      # The suites drive the packaged application with `_electron` of
      # Playwright, which uses the Chromium of Electron, so Playwright's
      # browsers are never downloaded. `install-deps` still apt-installs the
      # shared libraries that Chromium (and thus Electron) needs to launch
      # under xvfb, and xvfb itself. It runs the playwright that pnpm-lock.yaml
      # pins, the version of the catalog of Freelens.
      - name: Install Playwright's OS dependencies
        run: |
          set -eo pipefail
          # `playwright install-deps` runs its own `apt-get update`/`install`,
          # so the archive/list redirect has to be a global apt config file it
          # picks up rather than per-invocation `-o` flags. dpkg's status stays
          # at the system default, so packages still install into the runner.
          mkdir -p .apt/cache/archives/partial .apt/state/lists/partial
          sudo tee /etc/apt/apt.conf.d/00freelens-cache >/dev/null <<EOF
          Dir::Cache::archives "$PWD/.apt/cache/archives";
          Dir::State::lists "$PWD/.apt/state/lists";
          EOF
          pnpm exec playwright install-deps chromium
          # apt ran as root, so hand the cache dir back to the runner user for
          # the cache-save post step to read.
          sudo chown -R "$(id -u):$(id -g)" .apt

      # The environment with its fixtures left in place. Its state, with the
      # generated credentials, is under the home of the runner: no step uploads it.
      - name: Bring the test environment up with its fixtures
        id: environment
        run: |
          if [ "${ENVIRONMENT}" = definitions ]; then
            pnpm --color=always e2e:cluster:up:definitions
            node e2e/scripts/local-demo.mts fixtures-static --context kind-freelens-velero-dev
          else
            pnpm --color=always demo:up
          fi
        env:
          ENVIRONMENT: ${{ matrix.part.environment }}

      # Freelens built at the validation target, or the build the cache keeps
      # for that commit, with its sandbox let start and its path in
      # FREELENS_APP, by the action the workflows of the integration tests and
      # of the views share.
      - name: Build Freelens
        uses: ./.github/actions/build-freelens
        with:
          ref: ${{ env.freelens_ref }}

      # The suites of the part, in one run from this repository, as
      # `pnpm e2e:views` runs them: on the environment with its fixtures the
      # runner places the fixtures of the views and of their tabs and waits for
      # the requests the server removes; on the CRDs alone it places the static
      # ones and waits for nothing. It runs the suites one at a time under xvfb,
      # each in a new profile of the application, on the environment the part
      # names and no other. A suite that fails is not run again.
      - name: Run the suites of the part
        run: node e2e/scripts/local-demo.mts views --context kind-freelens-velero-dev
        env:
          E2E_TEST_PATTERN: ${{ join(matrix.part.suites, ' ') }}
          E2E_ENVIRONMENT: ${{ matrix.part.environment }}

      # On the environment with its fixtures, the cleanup of the fixtures of the
      # tabs, which has the server delete the backups it synced from the store
      # and removes the namespaces of the run, then the readiness of the
      # installation it leaves: proven here on the hosted runner, after the
      # suites, whatever they found, and before the environment is taken down.
      # The CRDs alone have no server to ask: they go with the environment.
      - name: Remove the fixtures and verify the environment they leave
        if: ${{ !cancelled() && steps.environment.outcome == 'success' && matrix.part.environment == 'demo' }}
        run: |
          node e2e/scripts/local-demo.mts fixtures-cleanup --context kind-freelens-velero-dev
          node e2e/scripts/local-demo.mts verify --context kind-freelens-velero-dev

      # Screenshots of the frame of the test cluster and the measures of the
      # suites: synthetic data. The state of the environment is not among them.
      - name: Upload the screenshots and the reports of the suites
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: views-${{ matrix.part.name }}
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Take the test environment down
        if: always()
        run: node e2e/scripts/local-demo.mts down --context kind-freelens-velero-dev

  # The parts as one check, under the name of the job they divide: it
  # passes when the plan passed and every part it chose passed, or when it
  # chose none.
  # It runs whatever happened, also in a run that was cancelled, so that the
  # check is never skipped while a part did not pass.
  views:
    name: views in Freelens v2
    needs: [plan, test-views]
    if: ${{ always() }}

    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5

    steps:
      - name: Check that every part passed
        env:
          PLAN: ${{ needs.plan.result }}
          PARTS: ${{ needs.plan.outputs.parts }}
          RESULT: ${{ needs.test-views.result }}
        run: |-
          echo "The plan: ${PLAN}; the parts of the views: ${PARTS:-none decided}, ${RESULT}"
          test "${PLAN}" = success
          if [ "${PARTS}" = "[]" ]; then
            echo "No part of the views is needed for these changes."
            exit 0
          fi
          test "${RESULT}" = success
