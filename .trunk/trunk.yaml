version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@24.15.0!
    - python@3.14.4
lint:
  enabled:
    - actionlint@1.7.12
    - markdownlint@0.49.0
    - yamlfmt@0.21.0
    - yamllint@1.38.0
  ignore:
    - linters: [ALL]
      paths:
        - node_modules/**
        - out/**
        - coverage/**
        - pnpm-lock.yaml
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
